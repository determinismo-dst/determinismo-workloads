# SPDX-License-Identifier: MIT
# A workload's hunt (DuckDB's by default) on an AWS bare-metal machine, from GitHub's hosted runner. determinismo's
# deterministic VMs run on its own KVM on the hardware, so the runner rents a bare-metal machine
# for the hunt: a spot bare-metal machine (`machine`: m5zn.metal by default, 24 cores; c5.metal, 48
# cores; r5.metal, 48 cores and 768 GB for memory-heavy workloads) from determinismo's base AMI, set up by
# the platform's own infra/host/setup.sh over SSH, the hunt run through serve for the asked
# minutes (host/metal-hunt.sh), its counts in this log and its report on this run's page (the job
# summary) and as a page of its own, read only (the platform's infra/host/report-static.sh), on
# GitHub Pages (the gh-pages branch: runs/<this workflow run's number>/) and as an artifact.
#
# A machine set up for a platform commit is saved as that commit's hunt image
# (determinismo-hunt-<commit>; one kept, older ones removed): later launches for the commit start
# from it, set up already. The machine is kept warm after a run (keep_minutes, 15 by default): marked idle, it powers
# itself off (which terminates it) that long after the run ends, unless a run starting meanwhile
# takes it, already set up (setup.sh again only when the platform's commit changed). So runs in a
# row neither pay the setup again nor wait for a bare-metal machine to finish terminating (its
# 48 vCPUs count against the spot quota for minutes). The machine's own timer also ends it should
# a job die: the run's length and two hours past the time it was last taken.
#
# Yours to set up once (the setup section of this repository's README: one CloudFormation stack):
# - the base AMI: the public one (the repository variable BASE_AMI, its id, README), or one of your
#   own named determinismo-base-* in the region (the platform's infra/aws/inspect-ami.sh
#   --type m5zn.metal --spot);
# - a security group named determinismo-ci, tagged project=determinismo-ci, with no rules (each
#   run opens SSH to its runner's address alone, then closes it);
# - GitHub's OIDC provider in IAM (token.actions.githubusercontent.com) and a role trusting this
#   repository's main only (token.actions.githubusercontent.com:sub = the repository's own prefix,
#   `gh api repos/<owner>/<repository>/actions/oidc/customization/sub`, then :ref:refs/heads/main;
#   with immutable subjects, repo:<owner>@<id>/<repository>@<id>), allowed to launch m5zn.metal machines tagged
#   project=determinismo-ci, to end only those and to mark them (the tags ci-state and
#   ci-platform); its ARN the secret AWS_ROLE_ARN. No access keys.
# - an SSH key of its own (ssh-keygen -t ed25519), the private half the secret CI_SSH_KEY: the
#   machine trusts it from its launch, so the next run can take it.
# - a spot vCPU quota of the machine's vCPUs at least (Service Quotas, L-34B43A08: m5zn.metal 48,
#   c5.metal and r5.metal 96), or purchase: on-demand.
# A machine is one workload's: a run takes an idle machine only of its own workload and type.
# Values of your account (its id, the machine's address and ids) are masked in this log.
name: aws-hunt

on:
  workflow_dispatch:
    inputs:
      workload:
        description: The workload (workloads/<name>)
        default: duckdb
      scenario:
        description: Its scenario
        default: append
      memory_mib:
        description: A VM's memory (MiB)
        default: "2048"
      timeline:
        description: A timeline's driving length
        default: 180s
      minutes:
        description: The hunt's length in minutes (10 to 240; the machine's setup, about half an hour, comes first)
        default: "60"
      platform_ref:
        description: The platform's ref to set the machine up with (empty, the commit build.zig.zon pins)
        default: ""
      keep_minutes:
        description: How long the machine waits for the next run after this one (0 to 60; 0 ends it at once)
        default: "15"
      machine:
        description: The bare-metal machine (vCPUs count against the spot quota)
        type: choice
        options: [m5zn.metal, c5.metal, r5.metal]
        default: m5zn.metal
      purchase:
        description: spot (about a quarter of the price; AWS may take the machine back) or on-demand
        type: choice
        options: [spot, on-demand]
        default: spot

permissions:
  contents: write # The report's page: the gh-pages branch.
  id-token: write

concurrency:
  group: aws-hunt
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TYPE: ${{ inputs.machine }}
  MINUTES: ${{ inputs.minutes }}
  PURCHASE: ${{ inputs.purchase }}
  PLATFORM_REF: ${{ inputs.platform_ref }}
  KEEP: ${{ inputs.keep_minutes }}
  WORKLOAD: ${{ inputs.workload }}
  SCENARIO: ${{ inputs.scenario }}
  MEMORY_MIB: ${{ inputs.memory_mib }}
  TIMELINE: ${{ inputs.timeline }}
  SSH_OPTS: -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=60 -o ServerAliveCountMax=10

jobs:
  hunt:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - name: Limits
        run: |
          [[ "$MINUTES" =~ ^[0-9]+$ ]] && [ "$MINUTES" -ge 10 ] && [ "$MINUTES" -le 240 ] || { echo "minutes: 10 to 240"; exit 1; }
          [[ "$KEEP" =~ ^[0-9]+$ ]] && [ "$KEEP" -le 60 ] || { echo "keep_minutes: 0 to 60"; exit 1; }
      - uses: actions/checkout@v4
      - name: The platform, at the commit build.zig.zon pins (or the asked ref)
        run: |
          ref=${PLATFORM_REF:-$(grep -oE 'determinismo/archive/[0-9a-f]{40}' build.zig.zon | cut -d/ -f3)}
          git clone -q https://github.com/determinismo-dst/determinismo platform
          git -C platform checkout -q "$ref"
          echo "platform $ref: $(git -C platform rev-parse --short=12 HEAD)"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
      - name: A machine (the idle one kept from a run before, or a new one)
        env:
          CI_SSH_KEY: ${{ secrets.CI_SSH_KEY }}
          # The operator's public key too (a repository variable): to debug a machine from one's
          # own, once one's address is let in on SSH.
          OPERATOR_SSH_KEYS: ${{ vars.OPERATOR_SSH_KEYS }}
          # determinismo's public base image (README), or empty: the account's own determinismo-base-*.
          BASE_AMI: ${{ vars.BASE_AMI }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && printf '%s\n' "$CI_SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub
          if [ -n "$BASE_AMI" ]; then
            ami=$BASE_AMI
          else
            ami=$(aws ec2 describe-images --owners self --filters 'Name=name,Values=determinismo-base-*' \
              --query 'sort_by(Images,&CreationDate)[-1].ImageId' --output text)
            [ "$ami" != None ] || { echo "no determinismo-base-* image in $AWS_REGION (or the variable BASE_AMI)"; exit 1; }
          fi
          echo "::add-mask::$ami"
          # This platform commit's hunt image when there is one: a machine from it is set up already.
          commit=$(git -C platform rev-parse HEAD)
          hunt=$(aws ec2 describe-images --owners self --filters "Name=name,Values=determinismo-hunt-${commit::12}" Name=state,Values=available \
            --query 'Images[0].ImageId' --output text)
          from="the base image (set up next)"
          if [ "$hunt" != None ]; then
            echo "::add-mask::$hunt"
            ami=$hunt
            from="the hunt image of ${commit::12} (no setup)"
          fi
          sg=$(aws ec2 describe-security-groups --filters Name=group-name,Values=determinismo-ci \
            --query 'SecurityGroups[0].GroupId' --output text)
          [ "$sg" != None ] || { echo "no determinismo-ci security group"; exit 1; }
          echo "::add-mask::$sg"
          echo "SG=$sg" >> "$GITHUB_ENV"
          me=$(curl -fsS https://checkip.amazonaws.com)
          echo "::add-mask::$me"
          # Rules a job that died left, then this runner's alone.
          old=$(aws ec2 describe-security-groups --group-ids "$sg" --query 'SecurityGroups[0].IpPermissions' --output json)
          [ "$(echo "$old" | tr -d ' \n')" = "[]" ] || aws ec2 revoke-security-group-ingress --group-id "$sg" --ip-permissions "$old" > /dev/null
          aws ec2 authorize-security-group-ingress --group-id "$sg" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=$me/32}]" > /dev/null

          # The machine's own deadline: setup's longest (an hour), the hunt, its wind-down.
          life=$((MINUTES + 120))
          echo "LIFE=$life" >> "$GITHUB_ENV"

          # An idle machine kept from a run before: taken, its deadline moved first (it was at
          # most keep_minutes away).
          id=$(aws ec2 describe-instances --filters Name=tag:project,Values=determinismo-ci Name=tag:ci-state,Values=idle \
            "Name=tag:ci-workload,Values=$WORKLOAD" "Name=instance-type,Values=$TYPE" \
            Name=instance-state-name,Values=running --query 'Reservations[0].Instances[0].InstanceId' --output text)
          if [ "$id" != None ]; then
            echo "::add-mask::$id"
            aws ec2 create-tags --resources "$id" --tags Key=ci-state,Value=busy
            ip=$(aws ec2 describe-instances --instance-ids "$id" --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)
            echo "::add-mask::$ip"
            if ssh $SSH_OPTS -o ConnectTimeout=30 "admin@$ip" "sudo /usr/local/sbin/ci-deadline $life"; then
              echo "INSTANCE=$id" >> "$GITHUB_ENV"
              echo "IP=$ip" >> "$GITHUB_ENV"
              echo "taken: the machine kept from a run before, at $(date -u +%H:%M)"
              exit 0
            fi
            echo "the idle machine did not answer (its deadline came first?): a new one"
          fi

          deadline=$(date -u -d "+$life minutes" '+%Y-%m-%d %H:%M:%S UTC')
          cat > user-data <<EOF
          #cloud-config
          ssh_authorized_keys:
            - $(cat ~/.ssh/id_ed25519.pub)
            - ${OPERATOR_SSH_KEYS:-$(cat ~/.ssh/id_ed25519.pub)}
          write_files:
            - path: /etc/systemd/system/ci-deadline.timer
              content: |
                [Timer]
                OnCalendar=$deadline
                Persistent=true
                [Install]
                WantedBy=timers.target
            - path: /etc/systemd/system/ci-deadline.service
              content: |
                [Service]
                Type=oneshot
                ExecStart=/usr/bin/systemctl poweroff
            - path: /usr/local/sbin/ci-deadline
              permissions: '0755'
              content: |
                #!/bin/sh
                # ci-deadline <minutes>: this machine powers itself off (terminating it) that long from now.
                set -e
                when=\$(date -u -d "+\$1 minutes" '+%Y-%m-%d %H:%M:%S UTC')
                printf '[Timer]\\nOnCalendar=%s\\nPersistent=true\\n[Install]\\nWantedBy=timers.target\\n' "\$when" > /etc/systemd/system/ci-deadline.timer
                systemctl daemon-reload
                systemctl restart ci-deadline.timer
                echo "powers itself off at \$when"
          runcmd:
            - [systemctl, daemon-reload]
            - [systemctl, enable, --now, ci-deadline.timer]
          EOF

          market=()
          [ "$PURCHASE" = spot ] && market=(--instance-market-options 'MarketType=spot,SpotOptions={SpotInstanceType=one-time,InstanceInterruptionBehavior=terminate}')
          # The zones that have the type, cheapest spot price first; the next one when a zone has none to give.
          zones=$(aws ec2 describe-instance-type-offerings --location-type availability-zone \
            --filters "Name=instance-type,Values=$TYPE" --query 'InstanceTypeOfferings[].Location' --output text)
          ranked=$(for z in $zones; do
            p=$(aws ec2 describe-spot-price-history --instance-types "$TYPE" --availability-zone "$z" \
              --product-descriptions Linux/UNIX --start-time "$(date -u +%Y-%m-%dT%H:%M:%S)" \
              --query 'SpotPriceHistory[0].SpotPrice' --output text)
            echo "$p $z"; done | sort -n)
          echo "$ranked" | sed 's/^/spot price: /'
          id=
          # The spot quota taken (a machine still shutting down holds its vCPUs for minutes):
          # the zones tried again each minute, 45 times at most (a c5.metal took up to 20 minutes to shut down).
          for attempt in $(seq 45); do
          while read -r price zone; do
            subnet=$(aws ec2 describe-subnets --filters "Name=availability-zone,Values=$zone" Name=default-for-az,Values=true \
              --query 'Subnets[0].SubnetId' --output text < /dev/null)
            [ "$subnet" != None ] || continue
            if id=$(aws ec2 run-instances --image-id "$ami" --instance-type "$TYPE" --subnet-id "$subnet" \
                 --security-group-ids "$sg" "${market[@]}" --instance-initiated-shutdown-behavior terminate \
                 --user-data file://user-data \
                 --block-device-mappings 'DeviceName=/dev/xvda,Ebs={VolumeSize=1000,VolumeType=gp3,DeleteOnTermination=true}' \
                 --tag-specifications "ResourceType=instance,Tags=[{Key=project,Value=determinismo-ci},{Key=Name,Value=determinismo-ci},{Key=ci-state,Value=busy},{Key=ci-workload,Value=$WORKLOAD}]" \
                   'ResourceType=volume,Tags=[{Key=project,Value=determinismo-ci}]' \
                 --query 'Instances[0].InstanceId' --output text 2> launch.err < /dev/null); then
              break
            fi
            echo "$zone: none ($(grep -oE '\([A-Za-z]+\)' launch.err | head -1))"
            id=
          done <<< "$ranked"
          [ -z "$id" ] && grep -q MaxSpotInstanceCountExceeded launch.err || break
          echo "the spot quota is taken: again in a minute"
          sleep 60
          done
          [ -n "$id" ] || { echo "no zone had a $TYPE to give"; exit 1; }
          echo "::add-mask::$id"
          echo "INSTANCE=$id" >> "$GITHUB_ENV"
          echo "launched: $TYPE, $PURCHASE, $zone (spot price $price/h), from $from, powers itself off at $deadline"
          aws ec2 wait instance-running --instance-ids "$id"
          ip=$(aws ec2 describe-instances --instance-ids "$id" --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)
          echo "::add-mask::$ip"
          echo "IP=$ip" >> "$GITHUB_ENV"
          echo "running at $(date -u +%H:%M)"
      - name: Set up the machine (the platform's infra/host/setup.sh; a kept machine only when the platform changed)
        # Without jank here: a workload in jank gets it next.
        run: |
          commit=$(git -C platform rev-parse HEAD)
          if [ "$(ssh $SSH_OPTS "admin@$IP" 'cat .ci-platform 2>/dev/null' || true)" = "$commit" ]; then
            echo "set up already with the platform at ${commit::12}"
            exit 0
          fi
          # A fresh machine ends its own boot first (cloud-init; apt's timers catching up on an
          # image days old held dpkg's lock and setup's apt failed), 15 minutes at most for each.
          for _ in $(seq 90); do ssh $SSH_OPTS -o ConnectTimeout=10 "admin@$IP" true 2> /dev/null && break; sleep 10; done
          ssh $SSH_OPTS "admin@$IP" 'timeout 900 cloud-init status --wait > /dev/null || true
            sudo systemctl stop apt-daily.timer apt-daily-upgrade.timer
            # Busy: an apt process, or a lock of theirs held (by inode in /proc/locks: not by the
            # name unattended-upgr, which is also a helper that never exits).
            busy() {
              pgrep -x "apt-get|apt|dpkg|apt.systemd.dai" > /dev/null && return 0
              for lock in /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock /var/cache/apt/archives/lock; do
                inode=$(stat -c %i "$lock" 2> /dev/null) && grep -q ":$inode " /proc/locks && return 0
              done
              return 1
            }
            for _ in $(seq 90); do busy || exit 0; sleep 10; done
            echo "apt still busy after 15 minutes"; exit 1'
          platform/infra/host/setup.sh "$IP" --user admin --no-jank
          ssh $SSH_OPTS "admin@$IP" "echo $commit > .ci-platform"
          echo "SET_UP=1" >> "$GITHUB_ENV"
      - name: jank on the machine (a workload in jank runs its --describe on the host's jank)
        env:
          # tools.sh's pinned build, kept on this repository's release (jank's own repository
          # republishes its rolling package under one name): tools.sh's fetch takes a file already
          # there with its checksum.
          JANK_DEB: https://github.com/determinismo-dst/determinismo-workloads/releases/download/jank-0.1-noble-68f6d0d8/jank_0.1-noble_amd64.deb
        run: |
          [ -f "workloads/$WORKLOAD/src/${WORKLOAD//-/_}/workload.jank" ] || { echo "not a workload in jank"; exit 0; }
          ssh $SSH_OPTS "admin@$IP" "mkdir -p ~/opt && { [ -f ~/opt/jank/.sha256 ] || curl -fsSL -o ~/opt/jank_0.1-noble_amd64.deb $JANK_DEB; } && cd determinismo && infra/host/tools.sh > ~/tools.log 2>&1 || { tail -20 ~/tools.log; exit 1; }; tail -1 ~/tools.log"
      # Fresh credentials: a setup can outlast the first ones (an hour).
      - uses: aws-actions/configure-aws-credentials@v4
        if: env.SET_UP == '1'
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
      - name: The machine saved as this platform commit's hunt image (later launches skip the setup)
        if: env.SET_UP == '1'
        run: |
          set -euo pipefail
          commit=$(git -C platform rev-parse HEAD)
          name=determinismo-hunt-${commit::12}
          existing=$(aws ec2 describe-images --owners self --filters "Name=name,Values=$name" --query 'Images[0].ImageId' --output text)
          [ "$existing" = None ] || { echo "$name is there already"; exit 0; }
          # A machine from it gets its own deadline at launch: this one's timer is off in the image.
          ssh $SSH_OPTS "admin@$IP" 'sudo systemctl disable --quiet ci-deadline.timer && sync'
          image=$(aws ec2 create-image --instance-id "$INSTANCE" --name "$name" --no-reboot \
            --description "determinismo hunt machine: the platform at $commit, set up by setup.sh --no-jank" \
            --tag-specifications "ResourceType=image,Tags=[{Key=project,Value=determinismo-ci},{Key=ci-platform,Value=$commit}]" \
              'ResourceType=snapshot,Tags=[{Key=project,Value=determinismo-ci}]' --query ImageId --output text)
          echo "::add-mask::$image"
          ssh $SSH_OPTS "admin@$IP" 'sudo systemctl enable --quiet ci-deadline.timer'
          echo "saving $name: available in some minutes, for the next launches"
          # Older commits' hunt images and their snapshots removed: one kept.
          aws ec2 describe-images --owners self --filters 'Name=name,Values=determinismo-hunt-*' Name=tag:project,Values=determinismo-ci \
            --query "Images[?Name!='$name'].[ImageId, join(' ', BlockDeviceMappings[].Ebs.SnapshotId)]" --output text |
          while read -r old snapshots; do
            [ -n "$old" ] || continue
            echo "::add-mask::$old"
            for snapshot in $snapshots; do echo "::add-mask::$snapshot"; done
            aws ec2 deregister-image --image-id "$old"
            for snapshot in $snapshots; do aws ec2 delete-snapshot --snapshot-id "$snapshot"; done
            echo "an older hunt image removed"
          done
      - name: Hunt (serve's page live for anyone, to the second; Pages' copy every 10 minutes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rsync -az -e "ssh $SSH_OPTS" --exclude .git --exclude platform --exclude zig-out --exclude .zig-cache \
            --exclude user-data --exclude launch.err --exclude report ./ "admin@$IP:determinismo-workloads/"
          # serve's page live and read only, for anyone, to the second: its --public-listen on the
          # machine's 127.0.0.1:7880, a tunnel there in front (host/live-tunnel.sh).
          ssh $SSH_OPTS "admin@$IP" 'sudo determinismo/infra/host/serve.sh admin start --public-listen 127.0.0.1:7880 > /dev/null'
          url=$(ssh $SSH_OPTS "admin@$IP" 'bash -s -- 7880' < host/live-tunnel.sh)
          ssh $SSH_OPTS "admin@$IP" "bash determinismo-workloads/host/metal-hunt.sh $MINUTES ${{ github.run_number }} $WORKLOAD $SCENARIO $MEMORY_MIB $TIMELINE" > hunt.log 2>&1 &
          hunt=$!
          # serve on the machine, here at 7878 (Pages' copies).
          ssh $SSH_OPTS -f -N -o ExitOnForwardFailure=yes -L 7878:127.0.0.1:7878 "admin@$IP"
          shown=0
          next=0
          run=
          while kill -0 "$hunt" 2>/dev/null; do
            sleep 15
            lines=$(wc -l < hunt.log)
            if [ "$lines" -gt "$shown" ]; then sed -n "$((shown + 1)),${lines}p" hunt.log; shown=$lines; fi
            # The tunnel's troubles as they come (its warnings, errors, lost connections).
            troubles=$(ssh $SSH_OPTS "admin@$IP" "grep -nE 'ERR|WRN|Unregistered|Lost|Retrying|terminated' ~/live-tunnel.log"  2>/dev/null || true)
            if [ -n "$troubles" ]; then
              echo "$troubles" | awk -F: -v after="${troubles_seen:-0}" '$1 > after' | cut -d: -f2- | sed 's/^/tunnel: /'
              troubles_seen=$(echo "$troubles" | tail -1 | cut -d: -f1)
            fi
            # The live link checked from here each minute; when it does not answer, the tunnel's log.
            if [ "$(( $(date +%s) / 60 ))" != "${checked:-}" ]; then
              checked=$(( $(date +%s) / 60 ))
              code=$(curl -s -m 10 -o /dev/null -w '%{http_code}' "$url/" || true)
              [ "$code" = 200 ] || { echo "$(date -u +%H:%M) the live link answers $code; the tunnel says:"; ssh $SSH_OPTS "admin@$IP" 'tail -5 ~/live-tunnel.log'; }
            fi
            if [ -z "$run" ]; then
              run=$(ssh $SSH_OPTS "admin@$IP" 'cat determinismo-workloads/run-id 2>/dev/null' || true)
              [ -n "$run" ] || continue
              export LIVE_URL="$url/#$run"
              echo "live: $LIVE_URL"
            fi
            # Pages' copy (and the index's live link) every 10 minutes, the first at once.
            [ "$(date +%s)" -ge "$next" ] || continue
            next=$(( $(date +%s) + 600 ))
            mkdir -p report
            if platform/infra/host/report-static.sh http://127.0.0.1:7878 "$run" report/index.html > report.log 2>&1 \
               && host/publish-report.sh report "${{ github.run_number }}-aws" "$MINUTES" >> report.log 2>&1; then
              echo "$(date -u +%H:%M) Pages' copy published: $(tail -1 report.log)"
            else
              echo "$(date -u +%H:%M) Pages' copy not published this time: $(tail -1 report.log)"
            fi
          done
          wait "$hunt" && status=0 || status=$?
          sed -n "$((shown + 1)),\$p" hunt.log
          exit "$status"
      - name: The run's report on this page (the job summary)
        if: always() && env.IP != ''
        run: ssh $SSH_OPTS "admin@$IP" 'cat determinismo-workloads/summary.md' >> "$GITHUB_STEP_SUMMARY" || echo "no report"
      - name: The run's report as a page of its own (read only)
        if: always() && env.IP != ''
        run: |
          run=$(ssh $SSH_OPTS "admin@$IP" 'cat determinismo-workloads/run-id 2>/dev/null' || true)
          [ -n "$run" ] || { echo "no run to report"; exit 0; }
          [ -x platform/infra/host/report-static.sh ] || { echo "this platform has no static report (before 2469d0b)"; exit 0; }
          # The hunt's tunnel to serve, or a new one.
          curl -fs -m 10 -o /dev/null http://127.0.0.1:7878/runs || ssh $SSH_OPTS -f -N -o ExitOnForwardFailure=yes -L 7878:127.0.0.1:7878 "admin@$IP"
          mkdir -p report
          platform/infra/host/report-static.sh http://127.0.0.1:7878 "$run" report/index.html
          echo "REPORT_RUN=$run" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        if: always() && env.REPORT_RUN != ''
        with:
          name: report-${{ github.run_number }}-aws
          path: |
            report/index.html
            report/stamp.json
          retention-days: 90
      - name: The report published (GitHub Pages)
        if: always() && env.REPORT_RUN != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(host/publish-report.sh report "${{ github.run_number }}-aws" "$MINUTES" | tail -1)
          echo "report: $url" | tee -a "$GITHUB_STEP_SUMMARY"
      # Fresh credentials: the first ones last an hour.
      - uses: aws-actions/configure-aws-credentials@v4
        if: always()
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
      - name: The machine kept for the next run (keep_minutes), or ended
        if: always()
        run: |
          if [ -n "${INSTANCE:-}" ]; then
            if [ "$KEEP" -gt 0 ] && [ -n "${IP:-}" ] && ssh $SSH_OPTS -o ConnectTimeout=30 "admin@$IP" "sudo /usr/local/sbin/ci-deadline $KEEP"; then
              aws ec2 create-tags --resources "$INSTANCE" --tags Key=ci-state,Value=idle
              echo "kept for the next run: idle, powering itself off in $KEEP minutes unless taken"
            else
              spot=$(aws ec2 describe-instances --instance-ids "$INSTANCE" --query 'Reservations[0].Instances[0].SpotInstanceRequestId' --output text)
              aws ec2 terminate-instances --instance-ids "$INSTANCE" > /dev/null && echo "machine terminated"
              # Its spot request ended too: left to AWS, it stayed active for 20 minutes after the
              # machine's end, its vCPUs still counted against the quota of the next run's.
              if [ "$spot" != None ]; then
                aws ec2 cancel-spot-instance-requests --spot-instance-request-ids "$spot" > /dev/null && echo "its spot request cancelled"
              fi
            fi
          fi
          if [ -n "${SG:-}" ]; then
            old=$(aws ec2 describe-security-groups --group-ids "$SG" --query 'SecurityGroups[0].IpPermissions' --output json)
            [ "$(echo "$old" | tr -d ' \n')" = "[]" ] || aws ec2 revoke-security-group-ingress --group-id "$SG" --ip-permissions "$old" > /dev/null
            echo "SSH closed"
          fi
