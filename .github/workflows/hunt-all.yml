# SPDX-License-Identifier: MIT
# One workload's hunt on both: an AWS bare-metal machine rented for it (aws-hunt.yml, ended after
# the run) and GitHub's free hosted runners (runner-trial.yml). Each publishes its run's report on
# this repository's Pages as soon as the run exists, then as it goes and at its end:
# runs/<this run's number>-aws/ and runs/<this run's number>-runner-<try>/ (a runner job that
# lands on Azure hardware stops at once, no report).
name: hunt

on:
  workflow_dispatch:
    inputs:
      workload:
        description: The workload (workloads/<name>)
        default: duckdb
      scenario:
        description: Its scenario
        default: append
      memory_mib:
        description: A VM's memory (MiB)
        default: "2048"
      timeline:
        description: A timeline's driving length
        default: 180s
      minutes:
        description: The hunt's length in minutes (10 to 240)
        default: "60"
      platform_ref:
        description: The platform's ref (empty, the commit build.zig.zon pins)
        default: next

permissions:
  contents: write
  id-token: write

jobs:
  aws:
    uses: ./.github/workflows/aws-hunt.yml
    secrets: inherit
    with:
      workload: ${{ inputs.workload }}
      scenario: ${{ inputs.scenario }}
      memory_mib: ${{ inputs.memory_mib }}
      timeline: ${{ inputs.timeline }}
      minutes: ${{ inputs.minutes }}
      platform_ref: ${{ inputs.platform_ref }}
      keep_minutes: "0"
  runner:
    uses: ./.github/workflows/runner-trial.yml
    with:
      workload: ${{ inputs.workload }}
      scenario: ${{ inputs.scenario }}
      memory_mib: ${{ inputs.memory_mib }}
      timeline: ${{ inputs.timeline }}
      minutes: ${{ inputs.minutes }}
      platform_ref: ${{ inputs.platform_ref || 'next' }}
