# SPDX-License-Identifier: MIT
# Whether determinismo's KVM patch (the platform's kernel/patches/0001-kvm-determinismo.patch,
# written for Debian's 6.12) applies to the kernel a hosted runner runs (Ubuntu's AWS kernel),
# and builds there: the first step to running determinismo on GitHub's runners (run by hand).
name: kvm-probe

on:
  workflow_dispatch:
    inputs:
      platform_ref:
        description: the platform's ref
        default: next

permissions:
  contents: read

jobs:
  kvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: determinismo-dst/determinismo
          ref: ${{ inputs.platform_ref }}
          path: platform
      - name: The kernel's source
        run: |
          echo "kernel $(uname -r), cpu $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2)"
          grep -q arch_perfmon /proc/cpuinfo || { echo "no core PMU here (an Azure runner): stop"; exit 1; }
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update -q > /dev/null
          sudo apt-get install -y -q dpkg-dev flex bison libelf-dev libssl-dev bc > /dev/null
          mkdir -p ~/k && cd ~/k
          # The running kernel's own source version (apt would fetch the newest otherwise).
          pkg="linux-image-unsigned-$(uname -r)"
          src=$(dpkg-query -W -f='${source:Package}' "$pkg")
          ver=$(dpkg-query -W -f='${source:Version}' "$pkg")
          echo "source $src $ver"
          apt-get source -q "$src=$ver" > source.log 2>&1 || { tail -5 source.log; exit 1; }
          ls -d ~/k/linux-*/
      - name: The patch
        run: |
          series=$(uname -r | cut -d. -f1,2)
          patch=$GITHUB_WORKSPACE/platform/kernel/patches-$series/0001-kvm-determinismo.patch
          [ -f "$patch" ] || patch=$GITHUB_WORKSPACE/platform/kernel/patches/0001-kvm-determinismo.patch
          echo "PATCH=$patch" >> "$GITHUB_ENV"
          echo "patch: ${patch#$GITHUB_WORKSPACE/platform/}"
          cd "$(ls -d ~/k/linux-*/ | head -1)"
          git init -q && git add -A arch/x86/kvm arch/x86/include virt/kvm include && git -c user.email=b@l -c user.name=b commit -qm base
          if git apply --check "$patch" 2> check.txt; then
            echo "applies cleanly"
          else
            echo "does not apply cleanly:"; head -30 check.txt
            patch -p1 --dry-run --fuzz=3 < "$patch" | grep -E "FAILED|fuzz|offset" | head -20 || true
          fi
      - name: Ubuntu's own files the patch touches (an artifact, to port onto)
        run: |
          cd "$(ls -d ~/k/linux-*/ | head -1)"
          mkdir -p ~/files && for f in arch/x86/include/asm/kvm-x86-ops.h arch/x86/include/asm/kvm_host.h arch/x86/kvm/vmx/main.c arch/x86/kvm/vmx/vmx.c arch/x86/kvm/vmx/vmx.h arch/x86/kvm/vmx/x86_ops.h arch/x86/kvm/x86.c include/uapi/linux/kvm.h; do mkdir -p ~/files/$(dirname $f) && cp $f ~/files/$f; done
          echo "$(uname -r)" > ~/files/KERNEL
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-kvm-files
          path: ~/files/
      - name: Build kvm and kvm-intel
        run: |
          cd "$(ls -d ~/k/linux-*/ | head -1)"
          git apply "$PATCH" || { echo "not built: the patch does not apply"; exit 0; }
          cp "/boot/config-$(uname -r)" .config
          cp "/usr/src/linux-headers-$(uname -r)/Module.symvers" . 2>/dev/null || echo "no Module.symvers"
          scripts/config --set-str SYSTEM_TRUSTED_KEYS "" --set-str SYSTEM_REVOCATION_KEYS "" --set-str MODULE_SIG_KEY ""
          make -s olddefconfig && make -s -j"$(nproc)" KERNELRELEASE="$(uname -r)" modules_prepare
          make -s -j"$(nproc)" KERNELRELEASE="$(uname -r)" M=arch/x86/kvm modules 2>&1 | tail -20
          ls -la arch/x86/kvm/*.ko
      - name: Load them
        run: |
          cd "$(ls -d ~/k/linux-*/ | head -1)"
          [ -f arch/x86/kvm/kvm-intel.ko ] || { echo "nothing built"; exit 0; }
          sudo rmmod kvm_intel kvm
          sudo insmod arch/x86/kvm/kvm.ko && sudo insmod arch/x86/kvm/kvm-intel.ko && echo "loaded ours"
          ls -l /dev/kvm; lsmod | grep -E '^kvm'
          sudo dmesg | grep -i kvm | tail -10
