# SPDX-License-Identifier: MIT
# determinismo on GitHub's hosted runners, step by step (run by hand): our KVM built for the
# runner's kernel (Ubuntu's AWS 7.0: the platform's kernel/patches-7.0) by the platform's own
# build-kvm.sh, loaded by load-kvm.sh, determinismo built, and its doctor's verdict.
name: kvm-probe

on:
  workflow_dispatch:
    inputs:
      platform_ref:
        description: the platform's ref
        default: next

permissions:
  contents: read

jobs:
  kvm:
    # Three at once: the hosted pool is AWS (Intel, with a PMU) or Azure (none, or AMD), and a
    # job on Azure stops in seconds.
    strategy:
      fail-fast: false
      matrix:
        try: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          repository: determinismo-dst/determinismo
          ref: ${{ inputs.platform_ref }}
          path: platform
      - name: The machine
        run: |
          echo "kernel $(uname -r), cpu $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2)"
          grep -q arch_perfmon /proc/cpuinfo || { echo "no core PMU here (an Azure runner): stop"; exit 1; }
      - name: Our KVM, built (the platform's build-kvm.sh, as on a host)
        run: platform/infra/host/build-kvm.sh 2>&1 | tail -15
      - name: Our KVM, loaded (load-kvm.sh)
        run: |
          sudo platform/infra/host/load-kvm.sh
          lsmod | grep -E '^kvm'; cat /run/determinismo-kvm
      - uses: actions/cache@v4
        with:
          path: ~/opt
          key: tools-${{ hashFiles('platform/infra/host/tools.sh') }}
      - name: determinismo, built
        run: |
          cd platform
          infra/host/tools.sh --build > /dev/null
          ~/opt/zig/zig build determinismo guest selftest -Drelease -Dduckdb="$HOME/opt/duckdb" -Djdk="$HOME/opt/jdk-25"
          ls -la zig-out/bin/determinismo
      - name: determinismo doctor, on our KVM
        run: |
          sudo chmod 666 /dev/kvm
          platform/zig-out/bin/determinismo doctor 2>&1 | tail -40 || true
      - name: The guest (guest/kernel/build.sh as on a host, Debian's 6.12 source pinned where apt has none)
        run: |
          sudo apt-get install -y -q busybox-static e2fsck-static erofs-utils cpio > /dev/null
          cd platform
          guest/kernel/build.sh ~/guest 2>&1 | tail -5
          zig-out/bin/det-initramfs --bin zig-out/bin --module ~/guest/det_guest.ko \
            --busybox "$(command -v busybox)" --e2fsck "$(command -v e2fsck.static)" --out ~/guest/base.cpio
          ls -la ~/guest/
      - name: determinismo doctor, with the guest
        run: platform/zig-out/bin/determinismo doctor 2>&1 | tail -25 || true
      - name: The end-to-end check setup.sh runs (bank)
        run: |
          cd platform
          ~/opt/zig/zig build e2e -Drelease -Donly=bank -Dduckdb="$HOME/opt/duckdb" -Djdk="$HOME/opt/jdk-25" 2>&1 | tail -40
