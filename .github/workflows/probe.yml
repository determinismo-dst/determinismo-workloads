# SPDX-License-Identifier: MIT
# What GitHub's hosted runners offer determinismo (run by hand): its hypervisor needs an Intel CPU
# with VT-x visible (a runner is a VM: nested), an invariant TSC, the branch counter (the core PMU),
# its own KVM module and room (16 GiB, 30 GB). Six jobs at once: runners land on different CPUs.
name: probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-24.04
    steps:
      - name: The machine
        run: |
          flags=$(grep -m1 '^flags' /proc/cpuinfo)
          has() { case " $flags " in *" $1 "*) echo yes ;; *) echo no ;; esac; }
          echo "cpu: $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2) ($(nproc) cpus)"
          echo "vmx $(has vmx), svm $(has svm), constant_tsc $(has constant_tsc), nonstop_tsc $(has nonstop_tsc), avx512f $(has avx512f), avx512cd $(has avx512cd), arch_perfmon $(has arch_perfmon), pdcm $(has pdcm)"
          echo "kernel: $(uname -r)"
          echo "/dev/kvm: $(ls -l /dev/kvm 2>&1)"
          echo "kvm modules: $(lsmod | grep -E '^kvm' | cut -d' ' -f1 | tr '\n' ' ')"
          for m in kvm_intel kvm_amd; do [ -r /sys/module/$m/parameters/nested ] && echo "$m nested: $(cat /sys/module/$m/parameters/nested)"; done
          echo "pmu: $(ls /sys/bus/event_source/devices/ | tr '\n' ' ')"
          echo "memory: $(free -g | awk '/Mem/ {print $2}') GiB; disk: / $(df -BG --output=avail / | tail -1) free, /mnt $(df -BG --output=avail /mnt 2>/dev/null | tail -1) free"
