name = "jank-model"
version = "0.1.0"
defaultTargets = ["Jank", "jank-model"]

[[require]]
name = "determinismo"
git = "https://github.com/determinismo-dst/determinismo.git"
rev = "b8f9cc91cdf838295ae32348e78bcf8c8cc77238"
subDir = "sdk/lean"

[[lean_lib]]
name = "Jank"

[[lean_exe]]
name = "jank-model"
root = "Main"

# Round 2: one driver per component (Run/<Component>.lean).
[[lean_exe]]
name = "jank-reader"
root = "Run.Reader"

[[lean_exe]]
name = "jank-strings"
root = "Run.Strings"

[[lean_exe]]
name = "jank-analyzer"
root = "Run.Analyzer"

[[lean_exe]]
name = "jank-codegen"
root = "Run.Codegen"

[[lean_exe]]
name = "jank-core"
root = "Run.Core"

[[lean_exe]]
name = "jank-nrepl"
root = "Run.Nrepl"

[[lean_exe]]
name = "jank-interop"
root = "Run.Interop"

[[lean_exe]]
name = "jank-seq"
root = "Run.Seq"

[[lean_exe]]
name = "jank-core2"
root = "Run.Core2"

# Round 3: one driver per area (Run/R3/<Area>.lean); models under Jank/R3/<Area>/.
[[lean_exe]]
name = "jank3-boost"
root = "Run.R3.Boost"

[[lean_exe]]
name = "jank3-immer"
root = "Run.R3.Immer"

[[lean_exe]]
name = "jank3-regex"
root = "Run.R3.Regex"

[[lean_exe]]
name = "jank3-runtime"
root = "Run.R3.Runtime"

[[lean_exe]]
name = "jank3-interop"
root = "Run.R3.Interop"

[[lean_exe]]
name = "jank3-codegen"
root = "Run.R3.Codegen"

[[lean_exe]]
name = "jank3-nrepl"
root = "Run.R3.Nrepl"

[[lean_exe]]
name = "jank3-proofs"
root = "Run.R3.Proofs"

[[lean_exe]]
name = "jank3-search"
root = "Run.R3.Search"

# Round 4: one driver per area (Run/R4/<Area>.lean); models under Jank/R4/<Area>/.
[[lean_exe]]
name = "jank4-feedback"
root = "Run.R4.Feedback"

[[lean_exe]]
name = "jank4-runtime"
root = "Run.R4.Runtime"

[[lean_exe]]
name = "jank4-interop"
root = "Run.R4.Interop"

[[lean_exe]]
name = "jank4-immer"
root = "Run.R4.Immer"

[[lean_exe]]
name = "jank4-regex"
root = "Run.R4.Regex"

[[lean_exe]]
name = "jank4-nrepl"
root = "Run.R4.Nrepl"

[[lean_exe]]
name = "jank4-modules"
root = "Run.R4.Modules"

[[lean_exe]]
name = "jank4-core"
root = "Run.R4.Core"
